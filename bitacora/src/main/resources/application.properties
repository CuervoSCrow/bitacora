spring.application.name=bitacora

server.port=8080

# Base vacía de prueba, no la original
spring.datasource.url=jdbc:mysql://localhost:3306/bitacora
spring.datasource.username=springboot
spring.datasource.password=canzervero
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# Configuración Hibernate / JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Ejecutar data.sql (y schema.sql si existiera) DESPUES de Hibernate
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# ============================================
# Configuracion de tests - H2 en memoria
# ============================================

#spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=MYSQL
#spring.datasource.username=sa
#spring.datasource.password=
#spring.datasource.driver-class-name=org.h2.Driver

# Consola web de H2 (opcional, util para inspeccionar la BD)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Desactivar devtools durante tests
spring.devtools.restart.enabled=false

