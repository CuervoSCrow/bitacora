
# ------------- Aplicación ------------------
spring.application.name=bitacora

# ------------- Datasource (H2 en memoria) -------
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=MYSQL;DATABASE_TO_LOWER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver.class-name=org.h2.Driver

#-------------- JPA / Hibernate ------------------
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

#--------------- Inicialización SQL ----------------
spring.jpa.defer-datasource-initialization=false
spring.sql.init.mode=never

#--------------- Consola H2 (opcional, útil para debug local) -----------------
spring.h2.console.enabled=false

#-------------- Devtools (desactivado en test) -------------------------------
spring.devtools.restart.enabled=false

logging.level.org.hibernate.SQL=warn
logging.level.org.hibernate.orm.jdbc.bind=warn
logging.level.org.springframework.test=info